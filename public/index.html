<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<title>Siemen van de Braak | Software Engineer</title>
		<meta name="description" content="Hi, I'm Siemen van de Braak, a software engineer from Kerkdriel, the Netherlands. Say hi on LinkedIn." />
		<meta name="theme-color" content="#000000" />

		<link rel="canonical" href="https://siemenvandebraak.com/" />

		<link rel="icon" href="img/favicon.svg" type="image/svg+xml" />

		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Siemen.dev" />
		<meta property="og:title" content="Siemen van de Braak | Siemen.dev" />
		<meta property="og:description" content="Hi, I'm Siemen van de Braak, a software engineer from Kerkdriel, the Netherlands." />
		<meta property="og:url" content="https://siemenvandebraak.com/" />
		<meta name="twitter:card" content="summary" />

		<noscript>
			<style>
				.cloth {
					background: #e8e2d8;
					border-radius: 22px;
				}
			</style>
		</noscript>

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />

		<link rel="stylesheet" href="styles/styles.css" />
	</head>

	<body>
		<div class="site">
			<div class="retro-backdrop" aria-hidden="true"></div>

			<canvas id="fxCanvas" class="fx-canvas" aria-hidden="true"></canvas>
			<div class="theme-bd bd-gameboy" aria-hidden="true"></div>
			<div class="theme-bd bd-blueprint" aria-hidden="true"></div>
			<div class="theme-bd bd-newspaper" aria-hidden="true"></div>
			<div class="theme-bd bd-fallout" aria-hidden="true"></div>
			<div class="theme-bd bd-keyboard" aria-hidden="true"></div>
			<div class="theme-bd bd-virtualboy" aria-hidden="true"></div>
			<div class="theme-bd bd-water" aria-hidden="true"></div>
			<div class="theme-bd bd-minecraft" aria-hidden="true"></div>
			<div class="theme-bd bd-lego" aria-hidden="true"></div>
			<div class="theme-bd bd-tetris" aria-hidden="true"></div>
			<div class="theme-bd bd-clock" aria-hidden="true"></div>
			<div class="theme-bd bd-runescape" aria-hidden="true"></div>
			<div class="theme-bd bd-gems" aria-hidden="true"></div>
			<div class="crt-overlay" aria-hidden="true"></div>

			<canvas id="clothCanvas" class="cloth-canvas" aria-hidden="true"></canvas>

			<header class="topbar">
				<a class="logo" href="#">siemen<span>.dev</span></a>
			</header>

			<main class="scene">
				<section id="cloth" class="cloth" aria-label="Business card">
					<div class="cloth-content">
						<div class="cloth-meta">
							<span></span>

							<button id="catButton" class="hidden-cat" type="button" aria-label="Mysterious cat">🐈</button>

							<span id="meow" class="meow" aria-live="polite"></span>
						</div>

						<div class="content-grid">
							<section class="intro">
								<p class="eyebrow">About</p>

								<h1>Siemen<span>.dev</span></h1>

								<p class="hello">Welcome :)</p>

								<p class="intro-text">I'm Siemen van de Braak, a medior software engineer based in the Netherlands.</p>
							</section>

							<section class="contact">
								<div class="section-label">
									<span>CONTACT</span>

									<span class="version">v1.18</span>
								</div>
								<h2>
									Where to
									<br />
									<em>Contact me</em>
								</h2>

								<div class="contact-list">
									<a class="contact-row" href="https://www.linkedin.com/in/siemen-van-de-braak-a871a8339" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn (opens in a new tab)">
										<span>LinkedIn</span>

										<span aria-hidden="true">↗</span>
									</a>

									<div class="contact-row">
										<span>Location</span>

										<span>Kerkdriel, NL</span>
									</div>
								</div>
							</section>
						</div>

						<div class="cloth-footer">
							<div class="skills" id="skills">
								<p class="skills-caption" id="skillsCaption">Experienced with</p>

								<ul class="skills-fallback">
									<li>Building applications</li>
									<li>Web development</li>
									<li>Video editing</li>
									<li>Design</li>
								</ul>

								<div class="skills-viewport" id="skillsViewport" aria-hidden="true">
									<div class="skills-track" id="skillsTrack"></div>
								</div>

								<ul class="sr-only" id="skillsList"></ul>
							</div>
						</div>
					</div>
				</section>
			</main>

			<footer class="page-footer" aria-hidden="true">
				<span id="dragState">READY</span>
			</footer>
		</div>

		<script src="scripts/app.js"></script>
		<script src="scripts/skills.js"></script>
	</body>
</html>
