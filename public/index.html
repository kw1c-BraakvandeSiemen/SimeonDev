<!doctype html>
<html lang="nl">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<title>Siemen.dev</title>

		<link rel="stylesheet" href="styles/styles.css" />
	</head>

	<body>
		<div class="site">
			<canvas id="clothCanvas" class="cloth-canvas"></canvas>

			<header class="topbar">
				<a class="logo" href="#">siemen<span>.dev</span> </a>
			</header>

			<main class="scene">
				<section id="cloth" class="cloth" aria-label="Interactive cloth">
					<div class="cloth-content">
						<div class="cloth-meta">
							<span></span>

							<button id="catButton" class="hidden-cat" type="button" aria-label="Mysterious cat">🐈</button>

							<span id="meow" class="meow" aria-live="polite"></span>
						</div>

						<div class="content-grid">
							<section class="intro">
								<p class="eyebrow">About</p>

								<h1>Siemen<span>.dev</span></h1>

								<p class="hello">Welcome :)</p>

								<p class="intro-text">Medior software engineer, based in the Netherlands.</p>
							</section>

							<section class="contact">
								<div class="section-label">
									<span>CONTACT</span>

									<span class="version"> v1.07</span>
								</div>

								<h2>
									Where to
									<br />
									<em>Contact me</em>
								</h2>

								<div class="contact-list">
									<a class="contact-row" href="https://www.linkedin.com/in/siemen-van-de-braak-a871a8339" target="_blank" rel="noopener noreferrer">
										<span>LinkedIn</span>

										<span>↗</span>
									</a>

									<div class="contact-row">
										<span>Location</span>

										<span>Kerkdriel, NL</span>
									</div>
								</div>
							</section>
						</div>

						<div class="cloth-footer"></div>
					</div>
				</section>
			</main>

			<footer class="page-footer">
				<span id="dragState">READY</span>
				<!-- maybe remove ?-->
			</footer>
		</div>

		<script src="scripts/app.js"></script>
	</body>
</html>
